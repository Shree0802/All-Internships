<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather Temperature Prediction</title>
<style>
body{font-family:Inter,system-ui,sans-serif;margin:0;background:#0f172a;color:#e2e8f0}main{max-width:980px;margin:40px auto;padding:24px}.card{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:24px;margin-bottom:20px}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}label{font-size:13px;color:#94a3b8}input,select,button{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#f8fafc}button{cursor:pointer;background:#2563eb;border:0;font-weight:700}.result{font-size:20px;margin-top:18px}.muted{color:#94a3b8}.links a{color:#93c5fd;margin-right:18px}</style>
</head>
<body><main>
<div class="card"><h1>🌤️ Weather Temperature Prediction</h1><p class="muted">FastAPI + Machine Learning deployment. No Streamlit required.</p><div class="links"><a href="/docs">API Docs</a><a href="/health">Health</a></div></div>
<div class="card"><h2>Temperature Prediction</h2><form id="form"><div class="grid">
<label>Humidity (%)<input name="humidity" type="number" value="65" min="0" max="100" step="0.1"></label>
<label>Pressure (hPa)<input name="pressure" type="number" value="1013.25" step="0.1"></label>
<label>Wind Speed<input name="wind_speed" type="number" value="12" min="0" step="0.1"></label>
<label>Rainfall<input name="rainfall" type="number" value="0" min="0" step="0.1"></label>
<label>Month<input name="month" type="number" value="9" min="1" max="12"></label>
<label>Day<input name="day" type="number" value="23" min="1" max="31"></label>
<label>Year<input name="year" type="number" value="2026" min="2000" max="2100"></label>
<label>Weather Condition<select name="weather_condition"><option>Clear</option><option>Sunny</option><option>Cloudy</option><option>Rainy</option><option>Foggy</option><option>Thunderstorm</option></select></label>
</div><br><button>Predict Temperature</button></form><div id="result" class="result"></div></div>
<div class="card"><h2>Forecast</h2><button id="forecastBtn">Generate 14-Day Forecast</button><pre id="forecast" class="muted"></pre></div>
<script>
const form=document.getElementById('form');form.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(form);const body=Object.fromEntries(f);['humidity','pressure','wind_speed','rainfall','month','day','year'].forEach(k=>body[k]=Number(body[k]));const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();document.getElementById('result').textContent=r.ok?`Predicted: ${d.predicted_temperature} °C | Model: ${d.model_used} | RMSE: ${d.rmse}`:`Error: ${d.detail||'Prediction failed'}`;});
document.getElementById('forecastBtn').onclick=async()=>{const r=await fetch('/forecast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({days:14})});const d=await r.json();document.getElementById('forecast').textContent=JSON.stringify(d,null,2)};
</script></main></body></html>
