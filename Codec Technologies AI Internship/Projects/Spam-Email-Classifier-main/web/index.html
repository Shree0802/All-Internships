<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spam Email Classifier</title>
<style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#0f172a;color:#e2e8f0}main{max-width:900px;margin:50px auto;padding:24px}.card{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:26px}textarea,button{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#f8fafc;margin-top:10px}textarea{min-height:220px;resize:vertical}button{background:#7c3aed;border:0;font-weight:700;cursor:pointer}.result{margin-top:20px;padding:18px;border-radius:12px;background:#0f172a}.muted{color:#94a3b8}a{color:#c4b5fd;margin-right:18px}</style></head>
<body><main><div class="card"><h1>🛡️ Spam Email Classifier</h1><p class="muted">FastAPI + NLP + Machine Learning. No Streamlit required.</p><p><a href="/docs">API Docs</a><a href="/health">Health</a></p><textarea id="email" placeholder="Paste an email message here..."></textarea><button id="btn">Check Email</button><div id="result" class="result muted">Enter an email to classify it.</div></div></main>
<script>document.getElementById('btn').onclick=async()=>{const text=document.getElementById('email').value.trim();if(!text)return;const result=document.getElementById('result');result.textContent='Classifying...';const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});const d=await r.json();result.innerHTML=r.ok?`<strong>${d.prediction}</strong><br>Spam probability: ${d.spam_probability}%<br>Confidence: ${d.confidence_score}%<br>Model: ${d.model_name}<br>Latency: ${d.execution_time_ms} ms`:`Error: ${d.detail||'Classification failed'}`};</script></body></html>
